allowBuilds:
  sharp: true
  unrs-resolver: true
onlyBuiltDependencies:
  - sharp
  - unrs-resolver
# Supply-chain hardening: quarantine releases for 7 days so malicious versions
# get detected and unpublished before we install them.
# (trustPolicy: no-downgrade removed — npm provenance is too sparse, flagged
# legit packages as takeovers.)
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - postcss@8.5.10
overrides:
  postcss@<8.5.10: ^8.5.10
